# Combined config for the SPL assignment: English (AI4Bharat Svarah) FastSpeech 2.
# Sections mirror the stock preprocess.yaml / model.yaml / train.yaml so the
# adapted train.py / preprocess.py / inference.py can split them apart.

preprocess:
  dataset: "Svarah"

  path:
    # corpus_path is unused: data comes from HuggingFace via
    # scripts/make_filelists.py, which writes wav/.lab files here.
    corpus_path: ""
    raw_path: "./raw_data/Svarah"
    preprocessed_path: "./preprocessed_data/Svarah"
    # G2P lexicon used by inference.py (preprocess_english) for in-lexicon words.
    lexicon_path: "lexicon/librispeech-lexicon.txt"

  preprocessing:
    # ~250 validation utterances (~1h at ~15s avg is unrealistic for Svarah's
    # short clips; make_filelists.py selects ~1h of audio for val — this count
    # is a fallback if train.txt is built by hand).
    val_size: 250
    text:
      text_cleaners: ["english_cleaners"]
      language: "en"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000 # must be 8000 for the HiFi-GAN universal vocoder
    pitch:
      feature: "phoneme_level"
      normalization: true
    energy:
      feature: "phoneme_level"
      normalization: true

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2

  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5

  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256

  # CHANGED (SPL assignment): Svarah has 117 speakers (~5 min each), so a
  # single-speaker model is impossible. Multi-speaker training with a learned
  # speaker embedding; speaker IDs come from preprocessed_data/Svarah/speakers.json.
  multi_speaker: true

  max_seq_len: 1000

  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"
    # CHANGED (SPL assignment): vendored weights live in the repo-root hifigan/
    # directory (utils/model.py resolves this with fallbacks).
    weights_path: "../../hifigan/generator_universal.pth.tar"

train:
  path:
    ckpt_path: "./output/ckpt/Svarah"
    log_path: "./output/log/Svarah"
    result_path: "./output/result/Svarah"
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [300000, 400000, 500000]
    anneal_rate: 0.3
  step:
    # Practical target on free GPUs (Kaggle P100 / Colab T4, batch 16):
    # ~100k-130k steps for intelligible speech (~12h). 200000 is the ceiling;
    # stop early with --restore_step resume if the deadline forces it.
    total_step: 200000
    log_step: 100
    synth_step: 1000
    val_step: 1000
    save_step: 10000
